name: Create Release

env:
  CI: true
  SECRET_THEATER_URL: ${{ secrets.SECRET_THEATER_URL }}

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Enable long paths in Git
      run: git config --system core.longpaths true

    - name: Enable Win32 long paths at runtime
      shell: pwsh
      run: reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Extract version from version.h
      id: extract_version
      shell: bash
      run: |
        VERSION_FILE="ASI Mod/src/resources/version.h"
        echo "Reading version from $VERSION_FILE"

        VERSION_MAJOR=$(grep '#define VERSION_MAJOR' "$VERSION_FILE" | awk '{print $3}')
        VERSION_MINOR=$(grep '#define VERSION_MINOR' "$VERSION_FILE" | awk '{print $3}')
        VERSION_PATCH=$(grep '#define VERSION_PATCH' "$VERSION_FILE" | awk '{print $3}')

        version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
        echo "Parsed version: $version"

        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Verify release does not already exist
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.extract_version.outputs.version }}"

        Write-Host "Checking whether release/tag already exists for version $version..."

        $releaseExists = gh release view $version --repo "${{ github.repository }}" 2>$null

        if ($LASTEXITCODE -eq 0) {
          Write-Error "Release already exists: $version"
          exit 1
        }

        $tagExists = git ls-remote --tags origin "refs/tags/$version"

        if ($tagExists) {
          Write-Error "Tag already exists: $version"
          exit 1
        }

        Write-Host "No existing release or tag found for version $version."

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2


    # -------------------------
    # Prepare output structure
    # -------------------------
    - run: mkdir dist
    - run: mkdir dist/plugins
    - run: mkdir dist/logs



    # -------------------------
    # Build
    # -------------------------
    - name: Build
      run: msbuild "ASI Mod\${{ github.event.repository.name }}.sln" /m -t:rebuild -verbosity:minimal -property:Configuration=Release -property:Platform=x64  -property:PlatformToolset=v143

    # Copy built binaries directly into plugins/
    - run: Copy-Item "ASI Mod\x64\Release\${{ github.event.repository.name }}.asi" "dist/plugins/${{ github.event.repository.name }}.asi"

    # Logs & metadata
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_Game.log"
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_Launcher.log"
    - run: Copy-Item README.md "dist/logs/${{ github.event.repository.name }}_README.md"
    - run: Copy-Item LICENSE "dist/plugins/${{ github.event.repository.name }}_LICENSE"
    - run: Copy-Item "ASI Mod\${{ github.event.repository.name }}.ini" "dist/plugins/${{ github.event.repository.name }}.ini"
    

    # Build Dist Folders
    - name: Build Dist Folders
      run: |
        $RepoRootDir = "${{ github.workspace }}"
        $scriptPath  = Join-Path $RepoRootDir "Build_Dist_Folders.py"

        if (-not (Test-Path $scriptPath)) {
          Write-Error "Build script not found."
          exit 1
        }

        Write-Host "Running Build_Dist_Folders.py..."
        py $scriptPath


    - name: Cache Secret Theater movies
      id: secret-theater-cache
      uses: actions/cache@v4
      with:
        path: external/secret-theater.zip
        key: secret-theater-${{ runner.os }}-v1

    - name: Install MEGAcmd
      if: steps.secret-theater-cache.outputs.cache-hit != 'true'
      run: choco install megacmd -y --force

    - name: Add MEGAcmd to PATH
      if: steps.secret-theater-cache.outputs.cache-hit != 'true'
      run: '"$env:LOCALAPPDATA\MEGAcmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

    - name: Download Secret Theater movies
      if: steps.secret-theater-cache.outputs.cache-hit != 'true'
      run: |
        New-Item -ItemType Directory -Force -Path external | Out-Null
        mega-get "$env:SECRET_THEATER_URL" "external/secret-theater.zip"
        if ($LASTEXITCODE -ne 0) { throw "Download failed." }

    - name: Prepare Secret Theater package
      run: |
        Expand-Archive external/secret-theater.zip -DestinationPath external/secret-theater -Force
        $movieDir = "external/secret-theater/us/movie"
        if (-not (Test-Path -LiteralPath $movieDir)) {
          $movieDir = "external/secret-theater/movie"
        }
        if (-not (Test-Path -LiteralPath $movieDir)) {
          throw "Invalid archive structure."
        }
        $movies = @(Get-ChildItem -LiteralPath $movieDir -File -Filter *.sdt)
        $captions = @(Get-ChildItem -LiteralPath $movieDir -Recurse -File -Filter *.xxs)
        if ($movies.Count -ne 21 -or $captions.Count -ne 21) {
          throw "Incomplete archive."
        }
        New-Item -ItemType Directory -Force -Path dist_secret_theater/us/movie | Out-Null
        foreach ($movie in $movies) {
          $caption = Join-Path $movieDir ($movie.BaseName + '/' + $movie.BaseName + '.xxs')
          if (-not (Test-Path -LiteralPath $caption) -or $movie.Length -eq 0 -or (Get-Item -LiteralPath $caption).Length -eq 0) {
            throw "Missing or empty file: $($movie.Name)"
          }
          Copy-Item -LiteralPath $movie.FullName -Destination dist_secret_theater/us/movie
          $captionDir = Join-Path dist_secret_theater/us/movie $movie.BaseName
          New-Item -ItemType Directory -Force -Path $captionDir | Out-Null
          Copy-Item -LiteralPath $caption -Destination $captionDir
        }

    # Package everything
    - name: Create Base release zip
      working-directory: dist
      run: 7z a -tzip "../${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip" *

    - name: Create Base 4K Assets release zip
      working-directory: dist_4k_assets
      run: 7z a -tzip "../${{ github.event.repository.name }}_Base_4K_Assets_Addon_v${{ steps.extract_version.outputs.version }}.zip" *

    - name: Create 2x Upscaled release zip
      working-directory: dist_2x
      run: 7z a -tzip "../${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip" *

    - name: Create 4x Upscaled release zip
      working-directory: dist_4x
      run: 7z a -tzip "../${{ github.event.repository.name }}_4x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip" * -v2000m

    - name: Create 4x Upscaled Nexus release zip
      working-directory: dist_4x
      run: 7z a -tzip "../${{ github.event.repository.name }}_4x_Upscaled_Nexus.zip" *

    - name: Create Secret Theater release zip
      working-directory: dist_secret_theater
      run: 7z a -tzip "../${{ github.event.repository.name }}_Secret_Theater_v${{ steps.extract_version.outputs.version }}.zip" us

    - name: Upload to NexusMods - Secret Theater
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: "00000"
        display_name: "MGS3 Community Bugfix Compilation - Secret Theater"
        filename: ${{ github.event.repository.name }}_Secret_Theater_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        description: |
            Secret Theater movies.
            Install the Base package first, then extract into your game folder.

    - name: Upload to NexusMods - Base
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 7339103
        display_name: "MGS3 Community Bugfix Compilation - Base"
        filename: ${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: main
        archive_existing_version: true
        primary_mod_manager_download: true
        description: |
            Extract the contents of the zip into your game folder.
            (e.g., steamapps\common\MGS3)

    - name: Upload to NexusMods - Base 4K Assets Addon
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 7339106
        display_name: "MGS3 Community Bugfix Compilation - 4K Asset Pack"
        filename: ${{ github.event.repository.name }}_Base_4K_Assets_Addon_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        description: |
            All Community Bugfix Compilation remade UI textures mastered to display natively at 3840x2160 (4K) resolution.)

            The base version must be installed first!

    - name: Upload to NexusMods - 2x Upscaled Addon
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 7339121
        display_name: "MGS3 Community Bugfix Compilation - 2x Upscaled"
        filename: ${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        description: |
            2x AI upscaled texture addon, upscaling -everything- except UI.

            The base version must be installed first!

            As we fix/replace nearly all of the game's textures, our upscaled text packs do FULLY REPLACE LiqMix's AI Slop texture packs.

    - name: Upload to NexusMods - 4x Upscaled Addon
      uses: Nexus-Mods/upload-action@v1.0.0-beta.9
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 7339196
        display_name: "MGS3 Community Bugfix Compilation - 4x Upscaled"
        filename: ${{ github.event.repository.name }}_4x_Upscaled_Nexus.zip
        version: "${{ steps.extract_version.outputs.version }}"
        category: optional
        archive_existing_version: true
        update_mod_version: true
        description: |
            4x AI upscaled texture addon, upscaling -everything- except UI. 20.9GB Extracted

            The base version must be installed first!

            As we fix/replace nearly all of the game's textures, our upscaled text packs do FULLY REPLACE LiqMix's AI Slop texture pack.

    - name: Generate Release Posting
      uses: ncipollo/release-action@v1
      with:
        artifacts: >
          ${{ github.event.repository.name }}_Secret_Theater_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_Base_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_Base_4K_Assets_Addon_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_2x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip,
          ${{ github.event.repository.name }}_4x_Upscaled_Addon_v${{ steps.extract_version.outputs.version }}.zip*
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.extract_version.outputs.version }}
        name: "${{ steps.extract_version.outputs.version }}"
        draft: true
        generateReleaseNotes: true
        artifactErrorsFailBuild: true
